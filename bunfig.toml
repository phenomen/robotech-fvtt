[fmt]
ignorePatterns = ["dist", "foundry"]
printWidth = 120
proseWrap = "never"
trailingComma = "es5"
sortImports = true
sortPackageJson = true
sortTailwindcss = true

[lint]
ignorePatterns = ["dist", "foundry"]
typeAware = true
typeCheck = true
reportUnusedDisableDirectives = "error"

[lint.categories]
correctness = "error"
pedantic = "error"
perf = "error"
restriction = "error"
style = "error"
suspicious = "error"

[lint.rules]
# Turn off React performance rules.
"react-perf/*" = "off"
# Turn off oxc rules.
"oxc/*" = "off"
# Sort is manuak
"sort-imports" = "off"
"sort-vars" = "off"
# Not using this.
"one-var" = "off"
# Rewrites comments that are already written.
"capitalized-comments" = "off"
# Foundry document and sheet subclasses override instance methods that never
# touch `this`.
"class-methods-use-this" = "off"
# Game procedures do not fit a cyclomatic budget.
complexity = "off"
"func-style" = ["error", "declaration", { allowArrowFunctions = true }]
# `id`, `cn`, and loop indexes are real names.
"id-length" = "off"
# The project is named-exports-only and uses barrels as folder modules, so the
# default-export and export-placement rules all invert.
"import/exports-last" = "off"
"import/group-exports" = "off"
"import/max-dependencies" = "off"
"import/no-named-export" = "off"
"import/prefer-default-export" = "off"
"import/unambiguous" = "off"
# Same prefixes as tsconfig `paths`. Bun resolves an alias, then treats the file as a parent import.
"import/no-relative-parent-imports" = ["error", { ignore = ["@/*", "@client/*", "@common/*"] }]
# Any call whose name ends in Sync. React's flushSync and Foundry's fromUuidSync are not blocking IO.
"n/no-sync" = ["error", { ignores = ["actorFromUuidSync", "flushSync", "fromUuidSync"] }]
# A browser system and a Bun script, not a library loaded with require().
"n/no-top-level-await" = "off"
# A `let` is often assigned on the next line. An initializer would be a dummy.
"init-declarations" = "off"
# Sheet components and game-rule functions outgrow any line or statement budget
# worth enforcing mechanically.
"max-lines" = "off"
"max-lines-per-function" = "off"
"max-params" = "off"
"max-statements" = "off"
# Foundry's namespaced constructors are not all PascalCase.
"new-cap" = "off"
# Document creates and updates have to run one after another.
"no-await-in-loop" = "off"
# Diagnostics stay, stray debugging does not.
"no-console" = ["error", { allow = ["error", "warn"] }]
# `continue` is how a loop skips an entry.
"no-continue" = "off"
"no-duplicate-imports" = ["error", { allowSeparateTypeImports = true }]
# `!!value` is the shorter form and is used throughout. The fixer's `Boolean(x)`
# also drops TypeScript's narrowing.
"no-implicit-coercion" = "off"
# Dice counts, thresholds, and step values are the domain.
"no-magic-numbers" = "off"
# Small choices are ternaries.
"no-ternary" = "off"
# Foundry treats `undefined` as "leave this field alone" in update payloads.
"no-undefined" = "off"
# Foundry's own API is `_preUpdate`, `_renderHTML`, `_onClose`.
"no-underscore-dangle" = "off"
# Hoisted declarations are fine; a real temporal-dead-zone read is not.
"no-use-before-define" = ["error", { classes = false, functions = false, variables = false }]
# `void actor.update(...)` is the documented fire-and-forget form, and it appears
# in expression position inside JSX handlers.
"no-void" = "off"
# A single property access is easier to read than a one-name pattern.
"prefer-destructuring" = "off"
"react/function-component-definition" = [
  "error",
  { namedComponents = "function-declaration", unnamedComponents = "arrow-function" },
]
# `disabled` and `disabled={true}` are both fine.
"react/jsx-boolean-value" = "off"
# The default only allows JSX in .jsx. This project uses .tsx.
"react/jsx-filename-extension" = ["error", { extensions = [".tsx", ".jsx"] }]
# Sheet trees are deep.
"react/jsx-max-depth" = "off"
# Only ever flags the separators around localized text (`:`, `/`, `{" "}`), never
# untranslated copy.
"react/jsx-no-literals" = "off"
# Inputs and sheets forward props.
"react/jsx-props-no-spreading" = "off"
# Fixed-slot arrays (drama lines, stress boxes, effect changes) carry no id of
# their own: the index is the identity. Document lists still key by `item.id`.
"react/no-array-index-key" = "off"
# A module exports a component and the small parts that exist only for it.
"react/no-multi-comp" = "off"
# A Fast Refresh rule; Foundry reloads the world instead.
"react/only-export-components" = "off"
# Data models are classes by design; the rule reads them as components.
"react/prefer-function-component" = "off"
# The react-jsx transform makes the React import unnecessary.
"react/react-in-jsx-scope" = "off"
# Foundry override signatures are async whether or not the body awaits.
"require-await" = "off"
# Inner functions are inferred. Exported ones are explicit-module-boundary-types.
"typescript/explicit-function-return-type" = "off"
# Members are public unless marked. The rule would print `public` on every field.
"typescript/explicit-member-accessibility" = "off"
# `defineSchema` returns Foundry's inferred field tree. `prepareDerivedData` is an override.
"typescript/explicit-module-boundary-types" = ["error", { allowedNames = ["defineSchema", "prepareDerivedData"] }]
# Data models declare schema fields as bare class properties.
"typescript/no-extraneous-class" = "off"
# Foundry hooks are typed `Promise<boolean | void>`.
"typescript/no-invalid-void-type" = "off"
# The Foundry client types are loose at the boundary; narrowing happens in
# `@/utils/documents` and `@/models/documents`.
"typescript/no-unsafe-argument" = "off"
"typescript/no-unsafe-assignment" = "off"
"typescript/no-unsafe-member-access" = "off"
"typescript/no-unsafe-type-assertion" = "off"
# A constructor parameter may declare the field.
"typescript/parameter-properties" = "off"
# Parameters include Foundry documents that the function writes to.
"typescript/prefer-readonly-parameter-types" = "off"
# Foundry override signatures are async whether or not the body awaits.
"typescript/require-await" = "off"
# Keep the awaited frame in stack traces.
"typescript/return-await" = ["error", "always"]
# Foundry values are often `0` or `""` where falsy is the intended check.
"typescript/strict-boolean-expressions" = "off"
# Files are named after their primary export, so both cases are legal; this still
# catches kebab-case and snake_case.
"unicorn/filename-case" = ["error", { cases = { camelCase = true, pascalCase = true } }]
# The callbacks take one typed argument. A wrapper hides the function's name.
"unicorn/no-array-callback-reference" = "off"
# Foundry stores and returns `null`, not `undefined`.
"unicorn/no-null" = "off"
# bun fmt prints lowercase hex digits; this rule wants them uppercase.
# https://github.com/oxc-project/oxc/issues/21949
"unicorn/number-literal-case" = "off"
# The fixer turns a straight if into a nested ternary.
"unicorn/prefer-ternary" = "off"
"unicorn/text-encoding-identifier-case" = ["error", { withDash = true }]

# A directory glob only matches when it starts with `**/`. `"src/types/**"` silently
# matches nothing; `"**/src/types/**"` works. Bare filenames like `"build.ts"` are fine.

[[lint.overrides]]
files = ["*.config.ts"]

[lint.overrides.rules]
"import/no-default-export" = "off"

# A Bun build script, not browser code, and its console output is the point.
[[lint.overrides]]
files = ["build.ts"]

[lint.overrides.rules]
"import/no-nodejs-modules" = "off"
"no-console" = "off"
"unicorn/max-nested-calls" = "off"
"unicorn/no-process-exit" = "off"

# These files describe Foundry's and vendors' API surface, not ours.
[[lint.overrides]]
files = ["**/src/types/**", "**/*.d.ts"]

[lint.overrides.rules]
# `export default interface` is how these modules are augmented.
"import/no-default-export" = "off"
"max-classes-per-file" = "off"
"typescript/method-signature-style" = "off"

[[lint.overrides]]
files = ["**/src/components/ui/**"]

[lint.overrides.rules]
"no-restricted-imports" = [
  "error",
  { paths = [
    { message = "Import the specific module (e.g. `@/utils/cn`) instead of the utils barrel.", name = "@/utils" },
  ] },
]
# `ui/` is the one layer allowed to style, so it passes `className` down.
"react/forbid-component-props" = "off"
